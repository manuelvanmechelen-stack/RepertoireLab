name: Browser regression tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run dev -- --host 127.0.0.1 > /tmp/repertoirelab-vite.log 2>&1 &
      - run: npx --yes --package @playwright/test playwright test
