name: RepertoireLab CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "chore/**"
      - "perf/**"
      - "ux/**"
      - "test/**"

permissions:
  contents: read

concurrency:
  group: repertoirelab-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, TypeScript, security and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Verify supported Node.js runtime
        run: |
          node -e "const major = Number(process.versions.node.split('.')[0]); if (major !== 24) { console.error('Expected Node.js 24, received ' + process.version); process.exit(1); }"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Audit installed dependency tree
        run: npm audit --audit-level=moderate

      - name: Run repertoire regression tests
        run: npm test

      - name: Check types and build production bundle
        run: npm run build

      - name: Confirm build output exists
        run: test -s dist/index.html
